test_post:
  name: Test post
  description: >-
    Post a sample embed with a working Claim button to the configured Discord
    channel, so the whole Discord path (post + claim + sensor write-back) can be
    tested without running a real wash.

reset_session:
  name: Reset session
  description: >-
    Force-close the load the bot thinks is running and go back to idle, closing
    its card in Discord. The escape hatch for a session that has wedged: it
    announces nothing and pings nobody, and the next real load posts a fresh
    card. Harmless when nothing is being tracked.

diagnostics:
  name: Diagnostics
  description: >-
    Check the bot's health and hand back the answer. Reports whether the
    session is wedged, whether a "load" is running that the energy meter says
    never happened, whether the washer's own sensors contradict the bot, and
    how often the washer's cloud is dropping. Changes nothing and pings nobody,
    so it is safe to run at any time — including mid-wash. The result appears
    in Developer Tools under the action; no logger configuration and no
    restart needed.
