name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # These checks only matter for submission to the HACS *default store*,
          # not for installing via a HACS custom repository:
          #  - brands: requires registering the domain in home-assistant/brands
          #  - description/topics: require GitHub repo "About" metadata
          ignore: brands description topics
